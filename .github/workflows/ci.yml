name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-cv-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis
          POSTGRES_DB: tennis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tennis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tennis:tennis@localhost:5432/tennis
      REDIS_URL: redis://localhost:6379/0
      CONFIG_DIR: ${{ github.workspace }}/config
      DEV_AUTO_USER: "true"
      S3_ENDPOINT_URL: http://localhost:5000
      S3_ACCESS_KEY: testing
      S3_SECRET_KEY: testing
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install backend + cv-worker packages
        run: pip install -e ./backend -e ./cv-worker -e "./backend[dev]"

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start moto S3 mock server
        run: |
          python -m moto.server -p 5000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/moto-api/ > /dev/null && break
            sleep 1
          done

      - name: Run backend tests
        run: python -m pytest backend/tests -v

      - name: Run cv-worker pipeline tests
        run: python -m pytest cv-worker/tests -v

      - name: Run dispatcher tests
        run: python -m pytest dispatcher/tests -v

      - name: Run golden set regression
        # golden/videos/ は.gitignore対象（大容量バイナリ）。golden/labels/にラベルが
        # 無ければgolden_runner.py自身がno-opで正常終了する（10 §ゴールデンセット、
        # 設計レビュー13 E'-golden-ci）。ラベル・動画がGit LFS等で用意され次第、
        # このステップがそのまま品質ゲートとして機能する
        env:
          GOLDEN_DIR: ${{ github.workspace }}/golden
        run: python -m cvpipeline.golden_runner

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
