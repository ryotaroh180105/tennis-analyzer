services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://tennis:tennis@postgres:5432/tennis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: tennis-analyzer
      CONFIG_DIR: /app/config
      DEV_AUTO_USER: "true"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *backend_env
    volumes:
      - ./config:/app/config:ro
      - ./backend/app:/app/backend/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-cpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend_env
    volumes:
      - ./config:/app/config:ro
      - ./backend/app:/app/backend/app
      - ./cv-worker/cvpipeline:/app/cv-worker/cvpipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.jobs.celery_app worker -Q cpu --loglevel=info --concurrency=2

  worker-gpu:
    build:
      context: .
      dockerfile: cv-worker/Dockerfile
    environment:
      <<: *backend_env
      ENCODER: libx264
    volumes:
      - ./config:/app/config:ro
      - ./backend/app:/app/backend/app
      - ./cv-worker/cvpipeline:/app/cv-worker/cvpipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # dev軽量モード：GPU実機がない環境ではlibx264（CPU）にフォールバックして疎通確認する
    # （10 §dev軽量モードの定義。本番はNVENC搭載GPUに差し替え）
    command: celery -A app.jobs.celery_app worker -Q gpu --loglevel=info --concurrency=1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
