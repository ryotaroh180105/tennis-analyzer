# プリフライトチェックのしきい値 v1（03-recording-guidelines.md §プリフライトチェック）
# 判定しきい値のコード内定数は不変原則2違反（設計レビュー13 E'）。

version: 1

resolution:
  min_width: 960     # 720p未満は警告
  min_height: 540

framerate:
  min_fps: 20.0      # 24fps未満は警告（多少の余裕を持たせた下限）

# stage1_court.detect_court の confidence に対するしきい値。
# ok以上=コート検出成功、warn以上=縮退せず続行するが警告、それ未満=縮退モード。
court_confidence:
  ok_min: 0.5
  warn_min: 0.2

# 画角カバレッジ（03 §プリフライトチェック）。厳密な消失点計算ではなく、
# detect_courtが既に推定したcourt_polygon_pxの遠側2隅（画面上側）が画面内に
# 収まっているかで近似する（簡易プロキシ。正確な実装は将来の改善課題）。
coverage:
  frame_margin_ratio: 0.02   # 遠側2隅が画面外にはみ出してよい許容比率（画面幅/高さに対する比率）

# カメラ固定（03 §プリフライトチェック）。フレーム間のグローバルモーション量を
# 位相相関（cv2.phaseCorrelate）で推定する。
stability:
  sample_hz: 2.0
  max_shift_ratio: 0.02     # フレーム対角線に対するフレーム間平均シフト量の許容比率

# 明るさ/逆光（03 §プリフライトチェック）。輝度（0-255グレースケール平均）が
# 極端に低い/高い場合を警告する。
brightness:
  min_mean: 40.0    # これ未満は暗すぎ
  max_mean: 220.0   # これ超は白飛び・強い逆光
