# ショット別フォーム解析 参照レンジ v1（Phase 3拡張）
# 設計: docs/design/12-form-analysis.md（スキーマ定義はこのファイル冒頭コメントが正）
# serve-mechanics.v1.yaml を統合・置換する後継ファイル。stage6が本ファイルの
# ローダーへ切り替わったコミットで旧ファイルを削除すること。
#
# スキーマ：
#   shots.<shot_type>.detector   — コード側のフェーズ検出器名（serve_like | groundstroke | volley）
#   shots.<shot_type>.metrics[]  — 指標定義。計算はprimitive（コード側の計算プリミティブ）×args。
#     at:          detectorが提供するキーイベント名。存在しない参照はロード時に拒否
#     primitive:   joint_angle | relative_height | forward_of_body | line_separation
#                  | event_interval | angle_delta
#     args:        関節はロール名（dominant_wrist / nondominant_knee 等）で書く。
#                  ハンドネス解決はエンジン側
#     only_style:  （任意）backhandのみ。one_handed | two_handed で出し分け
#     consistency_cv_max: （任意）スイング間の IQR/中央値 がこれを超えたら
#                  「ばらつき大」フィードバック候補にする
#
# citation_status: 大半の elite_range は文献レビュー未完了の暫定値（placeholder）。
# コーチング文脈で提示する前に一次文献（ITF Coaching & Sport Science Review等）で検証し
# metrics[].source を具体的出典に差し替えること。それまでUI/LLM側は
# 「参考値（検証中）」の断り書きを必須で添える（06 §リスクまとめ）。
#
# serveの3指標（knee_flexion_at_trophy / shoulder_hip_separation_at_trophy /
# elbow_extension_at_impact）はPubMed MCP（get_full_text_article）で本文を確認済み。
# 角度の符号規約（ISBコンベンション、伸展位0°基準）をMethods章の記述で明示的に確認し、
# 本アプリのjoint_angleプリミティブ（伸展位180°基準）への180-flexion変換の妥当性が
# 裏付けられた。forehandの1指標はWebSearch経由（本文未確認）。それ以外は依然placeholder。
# citation_statusは全体としてはまだ「検証中」のまま（指標単位・ショット単位への細分化は
# 将来のスキーマ変更として12aに記載、今回は見送り）。詳細・出典はdocs/design/
# 12a-mechanics-literature-notes.md参照。
version: 1
citation_status: placeholder_pending_literature_review

defaults:
  # ランドマークの平均visibilityがこれ未満の指標は測定不能＝unknown（不変原則1）
  min_landmark_visibility: 0.6
  # レンジ逸脱の重要度ランキングでフィードバックする件数の上限（06 §比較アルゴリズム4）
  max_feedback_metrics: 3

# スイング分割（1動画=複数スイング前提。12 §スイング分割）
swing_detection:
  min_peak_speed_mps: 3.0      # 利き手首スピード（world座標m/s）のピーク下限。placeholder
  min_interval_s: 1.5          # 直前スイングからこれ未満のピークは同一スイングとみなす
  window_pre_s: 1.5            # ピーク前の切り出し窓
  window_post_s: 1.0           # ピーク後の切り出し窓
  min_valid_swings: 3          # 有効スイングがこれ未満なら insufficient_data（レンジ比較を出さない）

shots:
  # -------------------------------------------------------------
  # serve — serve-mechanics.v1.yaml からの移設（指標は同一）
  # -------------------------------------------------------------
  serve:
    detector: serve_like
    phases: [preparation, toss, trophy, acceleration, impact, follow_through]
    metrics:
      - id: knee_flexion_at_trophy
        at: trophy
        primitive: joint_angle
        args: {points: [nondominant_hip, nondominant_knee, nondominant_ankle]}
        unit: deg
        # 全文確認済み（PubMed MCP経由、PMC11260724）。Methods: "According to the ISB
        # convention, all angles are defined as zero in the anatomical reference position"
        # と明記されており、27研究のメタ分析統合値は屈曲角度（伸展位0°基準）で報告されている
        # ことを本文で確認した。前膝（"front knee" = 利き手と逆側の踏み込み脚 = nondominant）
        # 屈曲 64.5±9.7°。本アプリのjoint_angleは伸展位180°基準のため180-flexionで変換：
        # 平均115.5°、±1SDで[105.8, 125.2]。他2文献の引用範囲（47–81°, 55.6–75°、いずれも
        # 屈曲角度表記）とも整合
        elite_range: [106, 125]
        tolerance: 10
        advice_key: knee_bend
        source: "Jacquier-Bret & Gorce systematic review & meta-analysis of tennis serve kinematics, Front Sports Act Living 2024, DOI 10.3389/fspor.2024.1432030 (PMID 39040663, PMC11260724). Full text confirmed via PubMed MCP — angle convention explicitly verified (ISB, 0°=anatomical position)."

      - id: elbow_height_at_trophy
        at: trophy
        primitive: relative_height
        args: {point: dominant_elbow, ref: dominant_shoulder}
        unit: relative_torso
        elite_range: [0.9, 1.15]
        tolerance: 0.1
        advice_key: trophy_elbow
        source: placeholder

      - id: shoulder_hip_separation_at_trophy
        at: trophy
        primitive: line_separation
        args: {lines: [shoulder_line, hip_line]}
        unit: deg
        # 全文確認済み（PubMed MCP経由、PMC11175047 / PMC11496077、同一著者Jacquier-Bret&Gorce）。
        # トロフィー位置での"lateral flexion shoulder-pelvis separation angle"として、
        # 引用された個別研究群で 17±11°, 34±7°, 31.5±7.3°, 31.6±7.5°, 30.5±6.4°,
        # 31.1±7.0°, 32.1±4.1°, 23±2°（サーブ種別・スタンス・成功/フォルト別）が報告されている。
        # 大半が23〜34°に集中。line_separationは回旋の角度差そのものなので伸展/屈曲の
        # 符号規約問題は無い（knee/elbow系より信頼度が高い）
        elite_range: [23, 34]
        tolerance: 8
        advice_key: hip_shoulder_separation
        source: "Jacquier-Bret & Gorce, Sensors 2024, DOI 10.3390/s24113292 (PMID 38894086, PMC11175047) and Front Sports Act Living 2024, DOI 10.3389/fspor.2024.1451174 (PMID 39444495, PMC11496077); both cite a cluster of individual studies at trophy position. Full text confirmed via PubMed MCP."

      - id: elbow_extension_at_impact
        at: impact
        primitive: joint_angle
        args: {points: [dominant_shoulder, dominant_elbow, dominant_wrist]}
        unit: deg
        # 全文確認済み（PMC11260724）。インパクト時肘屈曲は外れ値研究（Wang et al.）を
        # 除いた精緻化値 29.2±9.9°（著者らが"more relevant"と明記）を採用。
        # 180-flexionで変換：平均150.8°、±1SDで[140.9, 160.7]。他2文献の引用範囲
        # （27–44°, 10–45°、いずれも屈曲角度表記）とも整合
        elite_range: [141, 161]
        tolerance: 12
        advice_key: impact_extension
        source: "Frontiers Sports Act Living (2024) tennis serve kinematics systematic review & meta-analysis — https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1432030/full ; angle-convention inferred, not confirmed against primary methodology"

      - id: contact_height_relative
        at: impact
        primitive: relative_height
        args: {point: dominant_wrist, ref: dominant_shoulder}
        unit: relative_torso
        elite_range: [1.3, 1.6]
        tolerance: 0.15
        consistency_cv_max: 0.2
        advice_key: contact_height
        source: placeholder

      - id: toss_apex_to_impact_ms
        at: impact
        primitive: event_interval
        args: {from_event: toss_apex, to_event: impact}
        unit: ms
        elite_range: [350, 550]
        tolerance: 80
        advice_key: toss_timing
        source: placeholder

  # -------------------------------------------------------------
  # forehand（3b）
  # -------------------------------------------------------------
  forehand:
    detector: groundstroke
    phases: [ready, backswing, forward_swing, contact, follow_through]
    metrics:
      - id: shoulder_hip_separation_at_backswing
        at: backswing_end
        primitive: line_separation
        args: {lines: [shoulder_line, hip_line]}
        unit: deg
        # 文献: 3D動作解析、バックスイング終盤（本アプリのbackswing_endと定義が近い）で
        # 上級者20.44° / 一般プレーヤー15.79°（P=0.029で有意差）。line_separationは
        # 回旋の角度差そのものなので符号規約問題は無い
        elite_range: [18, 30]
        tolerance: 6
        advice_key: unit_turn
        source: "Biomechanical model of forehand stroke of tennis players (ResearchGate) — https://www.researchgate.net/publication/390275143_Biomechanical_model_of_forehand_stroke_of_tennis_players ; two-group means (skilled vs. ordinary), no SD reported, range is an estimate"

      - id: contact_forward_of_hip
        at: contact
        primitive: forward_of_body
        args: {point: dominant_wrist}
        unit: relative_torso
        elite_range: [0.3, 0.7]
        tolerance: 0.1
        consistency_cv_max: 0.25
        advice_key: contact_point
        source: placeholder

      - id: contact_height_relative
        at: contact
        primitive: relative_height
        args: {point: dominant_wrist, ref: dominant_hip}
        unit: relative_torso
        elite_range: [0.5, 1.0]
        tolerance: 0.15
        consistency_cv_max: 0.25
        advice_key: contact_height
        source: placeholder

      - id: backswing_to_contact_ms
        at: contact
        primitive: event_interval
        args: {from_event: backswing_end, to_event: contact}
        unit: ms
        elite_range: [250, 450]
        tolerance: 80
        advice_key: swing_tempo
        source: placeholder

      # ダブルベンド〜ストレートアームまで正常形が広い。レンジ広め・参考扱い
      - id: elbow_angle_at_contact
        at: contact
        primitive: joint_angle
        args: {points: [dominant_shoulder, dominant_elbow, dominant_wrist]}
        unit: deg
        elite_range: [110, 165]
        tolerance: 15
        advice_key: arm_structure
        source: placeholder

  # -------------------------------------------------------------
  # backhand（3b） — スタイル別出し分けあり
  # -------------------------------------------------------------
  backhand:
    detector: groundstroke
    phases: [ready, backswing, forward_swing, contact, follow_through]
    metrics:
      - id: shoulder_hip_separation_at_backswing
        only_style: one_handed
        at: backswing_end
        primitive: line_separation
        args: {lines: [shoulder_line, hip_line]}
        unit: deg
        elite_range: [25, 45]
        tolerance: 8
        advice_key: unit_turn
        source: placeholder

      # 両手打ちは体幹一体で回るため捻転差の参照レンジが狭い
      - id: shoulder_hip_separation_at_backswing_2h
        only_style: two_handed
        at: backswing_end
        primitive: line_separation
        args: {lines: [shoulder_line, hip_line]}
        unit: deg
        elite_range: [15, 35]
        tolerance: 8
        advice_key: unit_turn
        source: placeholder

      - id: contact_forward_of_hip
        at: contact
        primitive: forward_of_body
        args: {point: dominant_wrist}
        unit: relative_torso
        elite_range: [0.35, 0.75]   # バックはフォアよりやや前で捉える
        tolerance: 0.1
        consistency_cv_max: 0.25
        advice_key: contact_point
        source: placeholder

      - id: contact_height_relative
        at: contact
        primitive: relative_height
        args: {point: dominant_wrist, ref: dominant_hip}
        unit: relative_torso
        elite_range: [0.5, 1.0]
        tolerance: 0.15
        consistency_cv_max: 0.25
        advice_key: contact_height
        source: placeholder

      # 片手バックはコンタクトでの肘伸展が形の要
      - id: elbow_extension_at_contact
        only_style: one_handed
        at: contact
        primitive: joint_angle
        args: {points: [dominant_shoulder, dominant_elbow, dominant_wrist]}
        unit: deg
        elite_range: [150, 180]
        tolerance: 10
        advice_key: arm_structure
        source: placeholder

      - id: backswing_to_contact_ms
        at: contact
        primitive: event_interval
        args: {from_event: backswing_end, to_event: contact}
        unit: ms
        elite_range: [250, 450]
        tolerance: 80
        advice_key: swing_tempo
        source: placeholder

  # -------------------------------------------------------------
  # smash（3c） — serve検出器の流用。トス系タイミング指標は除外
  # -------------------------------------------------------------
  smash:
    detector: serve_like
    # "point"（非利き腕でボールを指す動作。serve_likeのtoss_apexイベントの読み替え）の
    # 表示名はfrontend側のFORM_PHASE_LABEL_JAで定義する（statusラベル等と同じくUI文言は
    # フロント側の辞書に置く既存パターンに合わせる）
    phases: [preparation, point, trophy, acceleration, impact, follow_through]
    metrics:
      - id: point_arm_apex_height
        at: toss_apex           # detector上のイベント名はserve_like共通（非利き手首の頂点）
        primitive: relative_height
        args: {point: nondominant_wrist, ref: nondominant_shoulder}
        unit: relative_torso
        elite_range: [0.6, 1.2]
        tolerance: 0.15
        advice_key: point_arm
        source: placeholder

      - id: shoulder_hip_separation_at_trophy
        at: trophy
        primitive: line_separation
        args: {lines: [shoulder_line, hip_line]}
        unit: deg
        elite_range: [20, 40]
        tolerance: 8
        advice_key: hip_shoulder_separation
        source: placeholder

      - id: elbow_extension_at_impact
        at: impact
        primitive: joint_angle
        args: {points: [dominant_shoulder, dominant_elbow, dominant_wrist]}
        unit: deg
        elite_range: [155, 180]
        tolerance: 10
        advice_key: impact_extension
        source: placeholder

      - id: contact_height_relative
        at: impact
        primitive: relative_height
        args: {point: dominant_wrist, ref: dominant_shoulder}
        unit: relative_torso
        elite_range: [1.2, 1.6]
        tolerance: 0.15
        consistency_cv_max: 0.2
        advice_key: contact_height
        source: placeholder

  # -------------------------------------------------------------
  # volley（3d） — 文献が最も薄い。レンジ検証完了まで「測定値のみ表示」許容（12 §ロールアウト）
  # -------------------------------------------------------------
  volley:
    detector: volley
    phases: [ready, punch, contact, recovery]
    metrics:
      # ボレーはスイングしない：コンタクト前後の肘角度変化が小さいほどパンチボレーの形
      - id: elbow_angle_delta_through_contact
        at: contact
        primitive: angle_delta
        args:
          points: [dominant_shoulder, dominant_elbow, dominant_wrist]
          from_event: punch_start
          to_event: contact
        unit: deg
        elite_range: [0, 25]
        tolerance: 10
        advice_key: punch_not_swing
        source: placeholder

      - id: contact_forward_of_body
        at: contact
        primitive: forward_of_body
        args: {point: dominant_wrist}
        unit: relative_torso
        elite_range: [0.2, 0.6]
        tolerance: 0.1
        consistency_cv_max: 0.3
        advice_key: contact_point
        source: placeholder

      - id: knee_flexion_at_contact
        at: contact
        primitive: joint_angle
        args: {points: [dominant_hip, dominant_knee, dominant_ankle]}
        unit: deg
        elite_range: [120, 150]
        tolerance: 10
        advice_key: stay_low
        source: placeholder
